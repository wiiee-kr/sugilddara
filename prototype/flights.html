<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/icons/app-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app-180.png">
<link rel="manifest" href="app.webmanifest">
<title>항공편 · 수길따라</title>
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/design-system.css?v=flight-gap36">
<link rel="stylesheet" href="styles/app-nav.css">
<link rel="stylesheet" href="styles/flights.css?v=flight-notice-3">

<link rel="stylesheet" href="styles/focus.css?v=keyboard-navigation">
<script src="scripts/focus.js" defer></script>
<link rel="stylesheet" href="styles/viewport.css">
</head><body class="flight-page app-viewport">
<main>
<form>
<section>
<h1>비행기 타는 순서 미리보기</h1>
<p>인천공항에서 출발/도착하는 항공편만 조회할 수 있어요.</p>
<div class="choices directions" role="group" aria-label="항공편 방향">
<label><input type="radio" name="direction" value="depart" checked><span>인천에서 출발</span></label>
<label><input type="radio" name="direction" value="arrive"><span>인천에 도착</span></label>
</div>
</section>
<section>
<h2><label for="flight">편명</label></h2>
<p id="hint">예매 내역에 적힌 편명을 KE703처럼 입력해 주세요.</p>
<input id="flight" aria-describedby="hint" placeholder="예: KE703" required autocapitalize="characters" autocomplete="off" spellcheck="false">
</section>
<section>
<h2 id="date-title">출발일</h2>
<div class="choices" role="group" aria-labelledby="date-title">
<label><input type="radio" name="day" value="today" checked><span>오늘</span></label>
<label><input type="radio" name="day" value="tomorrow"><span>내일</span></label>
<input type="radio" name="day" value="custom" hidden>
<button id="choose-date" type="button" aria-haspopup="dialog" aria-controls="calendar" aria-pressed="false">날짜 선택</button>
</div>
<input id="custom-date" type="hidden" name="date">
</section>
<button type="submit" aria-describedby="flight-notice">항공편 조회하기</button>
<p id="flight-notice">정확성을 위해 항공사나 공항 전광판에서도 확인해주세요.</p>
<p id="status" role="status"></p>
</form>
<a hidden class="bus" href="https://www.airport.kr/ap_ko/976/subview.do">공항버스 안내 보기 ↗</a>
</main>
<nav class="app-nav" aria-label="주요 메뉴">

</nav>
<dialog id="calendar" aria-labelledby="calendar-title">
<h2 id="calendar-title" tabindex="-1" autofocus>날짜 선택</h2>
<div class="month-nav"><button type="button" id="prev-month" aria-label="이전 달">‹</button><strong id="month" aria-live="polite"></strong><button type="button" id="next-month" aria-label="다음 달">›</button></div>
<div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div id="days"></div>
<button type="button" id="close-calendar">닫기</button>
</dialog>
<script src="scripts/flights.js?v=fixed-title"></script>
</body></html>
