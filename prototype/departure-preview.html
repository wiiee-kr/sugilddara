<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/icons/app-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app-180.png">
<link rel="manifest" href="app.webmanifest">
<title>인천공항 출국 안내 · 수길따라</title>
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/design-system.css?v=example-credit">
<link rel="stylesheet" href="styles/layout.css">
<style>
* { box-sizing:border-box }
html { background:#f1f4f6 }
body { display:flow-root; max-width:480px; margin:0 auto; background:white; color:#202833; font:18px/1.55 var(--font-app),sans-serif; word-break:keep-all }
main { margin:auto; max-width:480px; min-height:calc(100svh - var(--app-bar-offset) - var(--app-bar-height)); background:white; display:flex; flex-direction:column; padding-inline:20px }
button,a { font:inherit; color:inherit }
button { background:white; border:1px solid #bbc6d0; border-radius:10px; cursor:pointer; min-height:48px; padding:9px 14px }
h1 { font-size:28px; line-height:1.3; margin:0 }
h1:focus { outline:none }
p { margin:8px 0 0 }
#place { border-radius:12px; background:#eff6ff; margin-top:var(--section-gap); padding:16px 20px }
#detail:not([hidden]) + #place { margin-top:8px }
#place strong { display:block; font-size:22px }
#answers { margin-top:var(--section-gap) }
#answers form { display:grid; gap:var(--section-gap) }
#answers[hidden] { display:none }
#answers a { border:1px solid #a9b7c4; border-radius:10px; padding:12px 16px; text-decoration:none; font-weight:600 }
footer { display:flex; align-items:center; gap:8px; margin-top:auto; position:sticky; bottom:0; background:white; padding:14px 0 max(14px,env(safe-area-inset-bottom)) }
#next { flex:1; text-align:center; padding:12px 8px; background:#086cd1; color:white; font-weight:600; text-decoration:none; border-radius:10px }


fieldset { border:0; padding:0; margin:0; min-width:0 }
legend { font-weight:600; padding:0 }
.hint { font-size:16px; color:#566373; margin:4px 0 8px }
.options { display:grid; grid-template-columns:1fr 1fr; gap:8px }
.options label { position:relative }
.options input { position:absolute; opacity:0 }
.options span { display:block; border:1px solid #a9b7c4; border-radius:10px; padding:11px 4px; text-align:center; cursor:pointer }
.options input:checked + span { border-color:#086cd1; background:#eff6ff; color:#005ebc; font-weight:600 }
#next[aria-disabled="true"] { background:#e4e8ed; color:#566373 }
#landmarks figure { margin:var(--section-gap) 0 18px }
#landmarks img { width:100%; height:auto; display:block; border-radius:12px }
#landmarks figcaption { margin-top:6px }
#detail { white-space:pre-line }
</style>
<link rel="stylesheet" href="styles/flight-steps.css?v=rounded-lines">
<link rel="stylesheet" href="styles/network-error.css">
<script src="scripts/network-error.js" defer></script>
<link rel="stylesheet" href="styles/focus.css?v=keyboard-navigation">
<script src="scripts/focus.js" defer></script>
<link rel="stylesheet" href="styles/viewport.css">
</head>
<body class="flight-page app-viewport">
<header class="app-bar">
  <div class="app-bar__leading">
    <button class="app-bar__icon" type="button" id="back" aria-label="뒤로가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
    <h1>공항 이용 안내</h1>
  </div>
</header>
<main>
<nav id="step-nav" class="step-nav" aria-label="출발 안내 단계"></nav>
<h1 id="title" tabindex="-1"></h1><p id="detail"></p>
<div id="place" hidden><span id="label"></span><strong id="value"></strong></div>
<div id="answers"></div>
<div id="landmarks"></div>
<footer><a id="next"></a></footer>
</main>
<script src="scripts/airport-order.js?v=departure"></script>
<script>
const el = id => document.getElementById(id);
const form = document.createElement('form');
for (const [name,question,hint,yes,no] of [
 ['pass','탑승권을 미리 받으셨나요?','종이로 받거나 휴대폰에 저장한 탑승권이에요. 예약 확인서만 있다면 ‘아직 안 받았어요’를 눌러 주세요.','받았어요','아직 안 받았어요'],
 ['bag','항공사에 맡길 짐이 있나요?','기내에 들고 탈 가방만 있다면 ‘없어요’를 선택하세요.','있어요','없어요']
]) {
 const field = document.createElement('fieldset');
 field.innerHTML = '<legend>'+question+'</legend><p class="hint">'+hint+'</p><div class="options"></div>';
 for (const [value,label] of [['yes',yes],['no',no]]) {
   const choice = document.createElement('label');
   choice.innerHTML = '<input type="radio" name="'+name+'" value="'+value+'"><span>'+label+'</span>';
   field.lastElementChild.append(choice);
 }
 form.append(field);
}
el('answers').append(form);
const next = el('next');
function showStepNav(pass, bag, stage) {
 const ready = Boolean(pass && bag);
 const path = '#' + pass + '/' + bag;
 const stops = [['start','출발 준비',path+'/prep']];
 if (pass !== 'yes' || bag !== 'no') {
   stops.push(['counter',pass === 'yes' ? '짐 맡기기' : '체크인',path]);
 }
 stops.push(['security','출국 수속',path+'/1'], ['gate','탑승구',path+'/3']);
 el('step-nav').replaceChildren(...stops.map(([key,label,href]) => {
   const link = document.createElement(ready && key !== stage ? 'a' : 'span');
   link.textContent = label;
   if (key === stage) link.setAttribute('aria-current','step');
   else if (ready) link.href = href;
   return link;
 }));
}
function updateRoute() {
 const {pass,bag} = Object.fromEntries(new FormData(form));
 showStepNav(pass, bag, 'start');
 if (pass && bag) {
   next.href='#'+pass+'/'+bag+(pass==='yes' && bag==='no'?'/1':'');
   next.removeAttribute('aria-disabled');
 } else {
   next.removeAttribute('href');
   next.setAttribute('aria-disabled','true');
 }
}
form.onchange=updateRoute;
function showLandmarks(names) {
 el('landmarks').replaceChildren(...names.map(name => {
   const instruction = landmarks[name][1];
   const figure = document.createElement('figure');
   const caption = document.createElement('figcaption');
   const frame = departurePhoto(name);
   caption.textContent = instruction;
   figure.append(frame, caption);
   return figure;
 }));
}
function counterPhotoFor(pass, bag) {
 if (pass === 'yes') return 'bag';
 return bag === 'yes' ? 'counter-bag' : 'counter';
}
function render() {
 const [pass,bag,part] = location.hash.slice(1).split('/');
 const chosen = ['yes','no'].includes(pass) && ['yes','no'].includes(bag);
 const direct = pass==='yes' && bag==='no';
 const path = '#'+pass+'/'+bag;
 const stage = !chosen || part === 'prep' ? 'start' : Number(part)>=3 ? 'gate' : part || direct ? 'security' : 'counter';
 let title, detail='', place, action, target, previous='#';
 if (chosen) {
   form.elements.pass.value=pass;
   form.elements.bag.value=bag;
 }
 if(stage==='start'){
   title='먼저, 출발층으로 가세요';
   detail='항공권 예매 내역에서 출발 터미널을 확인해 주세요.';
   place=['','제2여객터미널 · 3층 출발층'];
   action='다음';

 } else if(stage==='counter'){
   const needsPass=pass==='no';
   title=needsPass?(bag==='yes'?'탑승권을 받고 짐을 맡기세요':'탑승권을 받으세요'):'짐을 맡기세요';
   detail=needsPass?'출발층 전광판에서 내 편명 옆의 카운터 번호를 확인하세요. 그 카운터로 가서 직원에게 여권을 보여주세요.':'출발층에서 내 항공사의 ‘짐 부치는 곳(Bag Drop)’을 찾으세요. 여권과 탑승권을 준비해 주세요.';
   place=['체크인 구역 예시 · 제2여객터미널','A. B. C. D 구역'];
   action='출국장 안내 보기'; target=path+'/1';
 } else if(stage==='security'){
   title='출국장으로 가세요';
   detail='여권과 탑승권을 들고 출국장으로 들어가세요.'+(direct?' 항공사가 서류 확인을 요청했다면 카운터에 먼저 들러주세요.':'');
   action='탑승구 안내 보기'; target=path+'/3'; previous=direct?'#':path;
 } else {
   title='내 비행기의 탑승구를 찾아가세요';
   detail='출국심사를 지나면 전광판에서 내 편명을 찾으세요. 같은 줄에 적힌 탑승구 번호를 확인하세요.';
   place=['탑승구 예시','253번']; action='안내 마치기'; target='flights.html'; previous=path+'/1';
 }
 const photos = { start:[], counter:[counterPhotoFor(pass,bag)], security:['security','passport'], gate:['wayfinding','gate'] };
 showLandmarks(photos[stage]);
 el('back').onclick=()=>{if(stage==='start') location.assign('flights.html'); else location.hash=previous};
 el('answers').hidden=stage!=='start';
 form.hidden=stage!=='start';
 el('title').textContent=title;
 el('detail').hidden=!detail; el('detail').textContent=detail;
 el('place').hidden=!place;
 if (place) {
   const [label, value] = place;
   el('label').hidden = !label;
   el('label').textContent = label;
   el('value').textContent = value;
 }
 next.textContent=action;
 if(stage==='start') updateRoute();
 else { showStepNav(pass, bag, stage); next.removeAttribute('aria-disabled'); next.href=target; }
 el('title').focus({preventScroll:true}); document.querySelector('main').scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script></body></html>
