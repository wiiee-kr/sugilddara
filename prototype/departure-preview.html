<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인천공항 출발 연습 · 수길따라</title>
<link rel="stylesheet" href="styles/fonts.css">
<style>
* { box-sizing:border-box }
body { margin:0; background:#f1f4f6; color:#202833; font:18px/1.55 var(--font-app),sans-serif; word-break:keep-all }
main { margin:auto; max-width:480px; min-height:100svh; background:white; display:flex; flex-direction:column; padding:12px 20px 0 }
header,footer,.ticket { display:flex; align-items:center; gap:8px }
header { min-height:48px; font-weight:600 }
button,a { font:inherit; color:inherit }
button { background:white; border:1px solid #bbc6d0; border-radius:10px; cursor:pointer; min-height:48px; padding:9px 14px }
#back { border:0; font-size:26px; padding:0; width:44px }
.ticket { justify-content:space-between; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid #dce3ea; font-size:16px }
#stage { color:#005ebc; margin:12px 0 8px; font-weight:600 }
h1 { font-size:28px; line-height:1.3; margin:0 }
h1:focus { outline:none }
p { margin:8px 0 0 }
#place { border-radius:12px; background:#eff6ff; margin-top:20px; padding:16px 20px }
#place strong { display:block; font-size:22px }
#answers { display:grid; gap:10px; margin-top:20px }
#answers a { border:1px solid #a9b7c4; border-radius:10px; padding:12px 16px; text-decoration:none; font-weight:600 }
footer { margin-top:auto; position:sticky; bottom:0; background:white; padding:14px 0 max(14px,env(safe-area-inset-bottom)) }
#next { flex:1; text-align:center; padding:12px 8px; background:#086cd1; color:white; font-weight:600; text-decoration:none; border-radius:10px }
dialog { width:min(420px,calc(100% - 32px)); border:none; border-radius:16px; padding:20px; color:inherit }
dialog::backdrop { background:#121b265c }
dialog h2 { margin:0; font-size:22px }
dialog li { padding:7px 0 }
li[aria-current] { font-weight:600; color:#005ebc }
dialog button { width:100% }
fieldset { border:0; padding:0; margin:0 0 10px; min-width:0 }
legend { font-weight:600; padding:0 }
.hint { font-size:16px; color:#566373; margin:4px 0 8px }
.options { display:grid; grid-template-columns:1fr 1fr; gap:8px }
.options label { position:relative }
.options input { position:absolute; opacity:0 }
.options span { display:block; border:1px solid #a9b7c4; border-radius:10px; padding:11px 4px; text-align:center; cursor:pointer }
.options input:checked + span { border-color:#086cd1; background:#eff6ff; color:#005ebc; font-weight:600 }
.options input:focus-visible + span { outline:2px solid #086cd1 }
#next[aria-disabled="true"] { background:#e4e8ed; color:#566373 }
#detail { white-space:pre-line }
</style>
</head>
<body><main>
<header><button id="back" aria-label="이전 화면">‹</button>공항 이용 안내</header>
<div class="ticket"><strong>인천 출발 연습</strong><span>항공편 정보는 예시예요</span></div>
<p id="stage"></p><h1 id="title" tabindex="-1"></h1><p id="detail"></p>
<div id="place" hidden><span id="label"></span><strong id="value"></strong></div>
<div id="answers"></div>
<footer><button id="order" type="button">순서</button><a id="next"></a></footer>
</main>
<dialog id="sheet" aria-labelledby="sheet-title"><h2 id="sheet-title">공항 이용 순서</h2><ol id="list"></ol><form method="dialog"><button>닫기</button></form></dialog>
<script>
const el = id => document.getElementById(id);
const stages = ['터미널 찾기','탑승권 받기·짐 부치기','보안검색','출국심사','탑승구 찾기·탑승'];
const form = document.createElement('form');
for (const [name,question,hint,yes,no] of [
 ['pass','탑승권을 미리 받으셨나요?','휴대폰이나 종이 탑승권을 말해요. 예약 확인서만 있다면 아직 받기 전이에요.','받았어요','아직 안 받았어요'],
 ['bag','부칠 짐이 있나요?','기내에 들고 탈 가방만 있다면 ‘없어요’를 선택하세요.','있어요','없어요']
]) {
 const field = document.createElement('fieldset');
 field.innerHTML = '<legend>'+question+'</legend><p class="hint">'+hint+'</p><div class="options"></div>';
 for (const [value,label] of [['yes',yes],['no',no]]) {
   const choice = document.createElement('label');
   choice.innerHTML = '<input type="radio" name="'+name+'" value="'+value+'"><span>'+label+'</span>';
   field.lastElementChild.append(choice);
 }
 form.append(field);
}
el('answers').append(form);
const next = el('next');
function updateRoute() {
 const {pass,bag} = Object.fromEntries(new FormData(form));
 if (pass && bag) {
   next.href='#'+pass+'/'+bag+(pass==='yes' && bag==='no'?'/1':'');
   next.removeAttribute('aria-disabled');
 } else {
   next.removeAttribute('href');
   next.setAttribute('aria-disabled','true');
 }
}
form.onchange=updateRoute;
function render() {
 const [pass,bag,part] = location.hash.slice(1).split('/');
 const chosen = ['yes','no'].includes(pass) && ['yes','no'].includes(bag);
 const direct = pass==='yes' && bag==='no';
 const path = '#'+pass+'/'+bag;
 const stage = !chosen ? 'start' : Number(part)>=3 ? 'gate' : part || direct ? 'security' : 'counter';
 let title, detail='', place, action, target, previous='#', current;
 if (chosen) {
   form.elements.pass.value=pass;
   form.elements.bag.value=bag;
 }
 if(stage==='start'){
   title='출발 준비를 확인해요';
   place=['출발 터미널','제2여객터미널'];
   action='내 안내 보기';
   current=[0];
 } else if(stage==='counter'){
   const needsPass=pass==='no';
   title=needsPass?(bag==='yes'?'탑승권을 받고 짐을 맡기세요':'탑승권을 받으세요'):'짐을 맡기세요';
   detail=needsPass?'항공사 체크인 카운터에서 여권을 보여주세요.'+(bag==='yes'?' 부칠 짐도 여기서 맡기세요.':''):'항공사 체크인 구역에서 ‘짐 부치는 곳(Bag Drop)’ 표지를 따라가세요.';
   place=['제2여객터미널 · 체크인 구역','A–D 구역'];
   action='출국장 안내 보기'; target=path+'/1'; current=[1];
 } else if(stage==='security'){
   title='출국장으로 가세요';
   detail=(direct?'여권과 탑승권을 준비하세요. 항공사에서 서류 확인을 요청했다면 카운터에 먼저 들러주세요.\n\n':'')+'① 보안검색대에서 안내에 따라 가방과 소지품을 검사받으세요.\n\n② 짐을 챙긴 뒤 출국심사 표지를 따라가세요. 여권을 준비하세요.';
   action='탑승구 안내 보기'; target=path+'/3'; previous=direct?'#':path; current=[2,3];
 } else {
   title='탑승구에서 비행기를 타세요';
   detail='전광판에서 내 편명과 탑승구 번호를 확인하고 이동하세요. 내 탑승 순서가 되면 여권과 탑승권을 보여주세요.';
   place=['탑승구 예시','253번']; action='처음부터 다시 보기'; target='#'; previous=path+'/1'; current=[4];
 }
 el('stage').textContent=stage==='start'?'출발 준비':(stage==='counter'?1:stage==='security'?(direct?1:2):(direct?2:3))+'단계';
 el('back').hidden=stage==='start';
 el('back').onclick=()=>{location.hash=previous};
 el('answers').hidden=stage!=='start';
 form.hidden=stage!=='start';
 el('title').textContent=title;
 el('detail').hidden=!detail; el('detail').textContent=detail;
 el('place').hidden=!place;
 if(place) [el('label').textContent,el('value').textContent]=place;
 next.textContent=action;
 if(stage==='start') updateRoute();
 else { next.removeAttribute('aria-disabled'); next.href=target; }
 next.onclick=()=>{if(stage==='gate') form.reset()};
 el('list').replaceChildren();
 stages.forEach((name,i)=>{
   const li=document.createElement('li');
   li.textContent=name;
   if(chosen && direct && i===1) li.append(' · 건너뜀');
   if(current.includes(i)){li.setAttribute('aria-current','step'); li.append(' · 현재 안내')}
   el('list').append(li);
 });
 el('title').focus({preventScroll:true}); window.scrollTo(0,0);
}
el('order').onclick=()=>el('sheet').showModal();
window.addEventListener('hashchange',render);
render();
</script></body></html>
