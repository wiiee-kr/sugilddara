<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수길따라 · 앱 미리보기</title>
<style>
* { box-sizing: border-box }
body { font-size: var(--type-body); margin: 0; background: #f3f6f7; color: #183c45; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
main { margin: auto; max-width: 480px; min-height: 100svh; padding: 64px 24px; background: #fff; }
h1 { font-size: 38px; letter-spacing: -2px; margin: 0 0 12px; }
p { line-height: 1.65; color: #52656a; }
small { display: block; margin-top: 48px; border-top: 1px solid #dce5e6; padding-top: 16px; color: #52656a; }
main { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
</style>
<link rel="stylesheet" href="styles/design-system.css">
<link rel="stylesheet" href="styles/app-nav.css">

<main><h1>수길따라</h1><p>수길따라님의 세계여행 루트를 따라<br>나만의 여행을 준비해요.</p><small>모바일 프로토타입 · 미리보기 준비 중</small></main>
<nav class="app-nav" aria-label="주요 메뉴">
<a href="#home"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M2 5 8 2l8 3 6-3v17l-6 3-8-3-6 3zm5 0v12l2 1V5zm8 2v12l2 1V7z"/></svg>홈</a>
<a href="packing.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M8 6V5a4 4 0 0 1 8 0v1a4 4 0 0 1 4 4v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-9a4 4 0 0 1 4-4Zm2 0h4V5a2 2 0 0 0-4 0v1Zm-2 7a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2H8Z"/></svg>준비물</a>
<a href="flights.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 9 3 14v2l7-2v5l-3 2v1l5-1 5 1v-1l-3-2v-5l7 2v-2l-7-5V5q0-4-2-4t-2 4z"/></svg>항공편</a>
<a href="community.html#/"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M5 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3H5Zm1 4a1 1 0 0 0 0 2h12a1 1 0 0 0 0-2H6Zm0 4a1 1 0 0 0 0 2h12a1 1 0 0 0 0-2H6Zm0 4a1 1 0 0 0 0 2h7a1 1 0 0 0 0-2H6Z"/></svg>커뮤니티</a>
<a href="mypage.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4.5"/><path d="M3 21a9 9 0 0 1 18 0z"/></svg>마이</a>
</nav>
<script>
const links = Array.from(document.querySelectorAll('nav a'));
const main = document.querySelector('main');
const homeContent = main.innerHTML;
function showPage() {
  if (location.hash === '#flights') {
    location.replace('flights.html');
    return;
  }
  if (location.hash === '#my') {
    location.replace('mypage.html');
    return;
  }
  if (location.hash === '#packing') {
    location.replace('packing.html');
    return;
  }
  if (location.hash === '#community') {
    location.replace('community.html#/');
    return;
  }
  const current = links.find(link => link.hash === location.hash) || links[0];
  for (const link of links) {
    if (link === current) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  }
  if (current === links[0]) main.innerHTML = homeContent;
  else {
    const heading = document.createElement('h1');
    heading.textContent = current.textContent;
    main.replaceChildren(heading);
  }
  document.title = current.textContent + ' · 수길따라';
}
window.addEventListener('hashchange', showPage);
showPage();
</script>
</html>
