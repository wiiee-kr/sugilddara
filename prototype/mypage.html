<body class="app-viewport has-bottom-nav">
  <div class="my-page">
    <header class="page-bar">
      <div class="app-bar__leading"><h1>마이페이지</h1></div>
    </header>
    <main>
      <section class="profile" aria-label="내 프로필">
        <button class="profile-photo-trigger" id="edit-profile-photo" type="button" aria-label="프로필 사진 수정"><img class="profile-image" src="assets/my-thumbnail.png" width="56" height="56" alt="내 프로필 사진"></button>
        <div class="profile-copy"><p class="profile-name" id="profile-name">여행동행</p></div>
        <button class="edit-button" id="edit-profile" type="button">프로필 수정</button>
      </section>
      <section class="menu-section" aria-label="북마크">
        <a class="menu-item" href="my-settings.html#bookmarks"><img class="menu-icon" src="assets/icons/untitled-ui/bookmark.svg" width="24" height="24" alt="" data-figma-node="1007:9756"><span>북마크한 여행지</span></a>
      </section>
      <section class="menu-section" aria-label="내 활동">
        <nav aria-label="내 활동">
          <a class="menu-item" href="community.html#/activity/posts"><img class="menu-icon" src="assets/icons/untitled-ui/file-02.svg" width="24" height="24" alt="" data-figma-node="1007:11592"><span>작성한 글</span></a>
          <a class="menu-item" href="community.html#/activity/comments"><img class="menu-icon" src="assets/icons/untitled-ui/message-chat-circle.svg" width="24" height="24" alt="" data-figma-node="1007:11067"><span>작성한 댓글</span></a>
          <a class="menu-item" href="community.html#/activity/likes"><img class="menu-icon" src="assets/icons/untitled-ui/heart.svg" width="24" height="24" alt="" data-figma-node="1007:10224"><span>좋아요한 글</span></a>
        </nav>
      </section>
      <section class="menu-section" aria-label="설정">
        <a class="menu-item" href="my-settings.html#settings"><img class="menu-icon" src="assets/icons/settings-02.svg" width="24" height="24" alt=""><span>설정</span></a>
      </section>
      <footer class="page-footer"><p>수길따라</p><p>디자인 프로토타입</p></footer>
    </main>
  </div>
  <dialog id="profile-dialog" aria-labelledby="dialog-title">
    <form id="profile-form" novalidate>
      <h2 id="dialog-title" class="visually-hidden">프로필 수정</h2>
      <button type="button" id="cancel-edit" class="sheet-close" aria-label="닫기">×</button>
      <button type="button" id="choose-photo" class="photo-edit">
        <img id="photo-preview" src="assets/my-thumbnail.png" width="96" height="96" alt="프로필 사진">
        <span>사진 수정</span>
      </button>
      <input id="profile-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <p id="photo-error" class="field-error" role="alert" hidden></p>
      <div class="nickname-field">
        <label for="nickname">닉네임</label>
        <input id="nickname" name="nickname" type="text" required autocomplete="nickname" aria-describedby="nickname-help nickname-error">
        <p id="nickname-help">한글·영문·숫자 1~20자, 공백·특수문자 사용 불가</p>
        <p id="nickname-error" class="field-error" role="alert" hidden></p>
      </div>
      <p id="save-error" class="field-error" role="alert" hidden></p>
      <button class="save-button" type="submit">확인</button>
    </form>
  </dialog>
  <p class="notice" id="notice" role="status" hidden></p>
